name: Go Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: install atlas
        run: |
          curl -sSf https://atlasgo.sh | sh
      - name: whoami
        run: |
          ATLAS_TOKEN=${{ secrets.TEST_ATLAS_TOKEN }} atlas whoami